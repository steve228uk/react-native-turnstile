name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: bun run verify

  compatibility:
    name: Compatibility (${{ matrix.line.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        line:
          - name: React 18 / React Native 0.76
            dependencies: >-
              react@18.2.0
              @types/react@18.3.27
              react-native@0.76.0
              react-native-webview@13.12.0
          - name: Latest peers
            dependencies: >-
              react@latest
              @types/react@latest
              react-native@latest
              react-native-webview@latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Install peer compatibility line
        run: bun add --no-save --exact ${{ matrix.line.dependencies }}

      - name: Typecheck and build
        run: bun run typecheck && bun run build

  expo-export:
    name: Expo production export (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ios
          - android
    env:
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Export Expo application
        working-directory: example
        run: >-
          bunx expo export
          --platform ${{ matrix.platform }}
          --output-dir dist/${{ matrix.platform }}
